<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - AI Internship Aggregator and Recommendation Platform</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Dynamic Navigation Bar Container -->
  <div id="navbar-container"></div>

  <!-- Registration Section -->
  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="brand-icon-box mx-auto mb-2" style="background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.3);">
          <i class="bi bi-person-plus-fill"></i>
        </div>
        <h3 class="fw-bold mb-1">Create Student Account</h3>
        <p class="small text-white-50 mb-0">Join the AI-powered career matching platform</p>
      </div>

      <div class="auth-body">
        <!-- Alert container for error/success messages -->
        <div id="alert-message-box" class="d-none alert mb-3" role="alert"></div>

        <form id="register-form" novalidate>
          <!-- Full Name -->
          <div class="mb-3">
            <label for="name" class="form-label fw-semibold small text-secondary">Full Name</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-person"></i></span>
              <input type="text" class="form-control border-start-0 ps-0" id="name" placeholder="e.g. Alex Johnson" required>
            </div>
            <div class="invalid-feedback">Please enter your full name.</div>
          </div>

          <!-- Email Address -->
          <div class="mb-3">
            <label for="email" class="form-label fw-semibold small text-secondary">Email Address</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
              <input type="email" class="form-control border-start-0 ps-0" id="email" placeholder="student@college.edu" required>
            </div>
            <div class="invalid-feedback">Please enter a valid email address.</div>
          </div>

          <!-- College Name -->
          <div class="mb-3">
            <label for="college_name" class="form-label fw-semibold small text-secondary">College / University Name</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-mortarboard"></i></span>
              <input type="text" class="form-control border-start-0 ps-0" id="college_name" placeholder="e.g. Stanford University / MIT" required>
            </div>
            <div class="invalid-feedback">Please enter your college name.</div>
          </div>

          <!-- Password -->
          <div class="mb-3">
            <label for="password" class="form-label fw-semibold small text-secondary">Password</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-lock"></i></span>
              <input type="password" class="form-control border-start-0 border-end-0 ps-0" id="password" placeholder="At least 6 characters" minlength="6" required>
              <button class="btn btn-outline-light border text-muted" type="button" id="toggle-password-btn">
                <i class="bi bi-eye" id="toggle-password-icon"></i>
              </button>
            </div>
            <div class="invalid-feedback">Password must be at least 6 characters.</div>
          </div>

          <!-- Confirm Password -->
          <div class="mb-4">
            <label for="confirm_password" class="form-label fw-semibold small text-secondary">Confirm Password</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-shield-check"></i></span>
              <input type="password" class="form-control border-start-0 ps-0" id="confirm_password" placeholder="Re-enter your password" required>
            </div>
            <div class="invalid-feedback">Passwords must match.</div>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="btn btn-brand w-100 py-2 mb-3" id="btn-submit-register">
            <i class="bi bi-person-check me-2"></i> Create Account
          </button>

          <!-- Login Link -->
          <div class="text-center small text-secondary">
            Already have an account? <a href="login.html" class="fw-bold text-primary text-decoration-none">Login</a>
          </div>
        </form>
      </div>
    </div>
  </main>

  <!-- Dynamic Footer Container -->
  <div id="footer-container"></div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Global Auth Script -->
  <script src="js/auth.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      Auth.renderNavbar('register');
      Auth.renderFooter();

      // Redirect if already logged in
      if (Auth.isLoggedIn()) {
        window.location.href = 'dashboard.html';
        return;
      }

      // Password toggle
      const toggleBtn = document.getElementById('toggle-password-btn');
      const passInput = document.getElementById('password');
      const passIcon = document.getElementById('toggle-password-icon');

      toggleBtn.addEventListener('click', () => {
        if (passInput.type === 'password') {
          passInput.type = 'text';
          passIcon.classList.replace('bi-eye', 'bi-eye-slash');
        } else {
          passInput.type = 'password';
          passIcon.classList.replace('bi-eye-slash', 'bi-eye');
        }
      });

      // Form submission
      const form = document.getElementById('register-form');
      const alertBox = document.getElementById('alert-message-box');
      const submitBtn = document.getElementById('btn-submit-register');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        alertBox.className = 'd-none alert mb-3';

        const name = document.getElementById('name').value.trim();
        const email = document.getElementById('email').value.trim();
        const college_name = document.getElementById('college_name').value.trim();
        const password = document.getElementById('password').value;
        const confirm_password = document.getElementById('confirm_password').value;

        // Validation
        if (!name || !email || !college_name || !password || !confirm_password) {
          showAlert('Please fill in all fields.', 'danger');
          return;
        }

        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(email)) {
          showAlert('Please enter a valid email address.', 'danger');
          return;
        }

        if (password.length < 6) {
          showAlert('Password must be at least 6 characters.', 'danger');
          return;
        }

        if (password !== confirm_password) {
          showAlert('Passwords do not match. Please verify.', 'danger');
          return;
        }

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Creating Account...';

        try {
          const res = await fetch('/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, email, college_name, password, confirm_password })
          });

          const data = await res.json();

          if (data.success) {
            showAlert(data.message, 'success');
            Auth.showToast('Registration successful! Redirecting to login...', 'success');
            setTimeout(() => {
              window.location.href = 'login.html';
            }, 1200);
          } else {
            showAlert(data.message || 'Registration failed.', 'danger');
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="bi bi-person-check me-2"></i> Create Account';
          }
        } catch (err) {
          showAlert('Network error. Please make sure the server is running.', 'danger');
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<i class="bi bi-person-check me-2"></i> Create Account';
        }
      });

      function showAlert(msg, type) {
        alertBox.className = `alert alert-${type} mb-3`;
        alertBox.textContent = msg;
        alertBox.classList.remove('d-none');
      }
    });
  </script>
</body>
</html>
