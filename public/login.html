<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - AI Internship Aggregator and Recommendation Platform</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Dynamic Navigation Bar Container -->
  <div id="navbar-container"></div>

  <!-- Login Section -->
  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="brand-icon-box mx-auto mb-2" style="background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.3);">
          <i class="bi bi-box-arrow-in-right"></i>
        </div>
        <h3 class="fw-bold mb-1">Student Login</h3>
        <p class="small text-white-50 mb-0">Sign in to access personalized internship recommendations</p>
      </div>

      <div class="auth-body">
        <!-- Alert container for error/success messages -->
        <div id="alert-message-box" class="d-none alert mb-3" role="alert"></div>

        <form id="login-form" novalidate>
          <!-- Email Address -->
          <div class="mb-3">
            <label for="email" class="form-label fw-semibold small text-secondary">Email Address</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
              <input type="email" class="form-control border-start-0 ps-0" id="email" placeholder="student@college.edu" required>
            </div>
            <div class="invalid-feedback">Please enter your registered email.</div>
          </div>

          <!-- Password with Show/Hide -->
          <div class="mb-4">
            <label for="password" class="form-label fw-semibold small text-secondary">Password</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-lock"></i></span>
              <input type="password" class="form-control border-start-0 border-end-0 ps-0" id="password" placeholder="Enter your password" required>
              <button class="btn btn-outline-light border text-muted" type="button" id="toggle-password-btn">
                <i class="bi bi-eye" id="toggle-password-icon"></i>
              </button>
            </div>
            <div class="invalid-feedback">Please enter your password.</div>
          </div>

          <!-- Login Button -->
          <button type="submit" class="btn btn-brand w-100 py-2 mb-3" id="btn-submit-login">
            <i class="bi bi-box-arrow-in-right me-2"></i> Login to Platform
          </button>

          <!-- Create Account Link -->
          <div class="text-center small text-secondary">
            Don't have an account yet? <a href="register.html" class="fw-bold text-primary text-decoration-none">Create Account</a>
          </div>
        </form>
      </div>
    </div>
  </main>

  <!-- Dynamic Footer Container -->
  <div id="footer-container"></div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Global Auth Script -->
  <script src="js/auth.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      Auth.renderNavbar('login');
      Auth.renderFooter();

      // Redirect if already logged in
      if (Auth.isLoggedIn()) {
        window.location.href = 'dashboard.html';
        return;
      }

      // Password toggle
      const toggleBtn = document.getElementById('toggle-password-btn');
      const passInput = document.getElementById('password');
      const passIcon = document.getElementById('toggle-password-icon');

      toggleBtn.addEventListener('click', () => {
        if (passInput.type === 'password') {
          passInput.type = 'text';
          passIcon.classList.replace('bi-eye', 'bi-eye-slash');
        } else {
          passInput.type = 'password';
          passIcon.classList.replace('bi-eye-slash', 'bi-eye');
        }
      });

      // Login submission
      const form = document.getElementById('login-form');
      const alertBox = document.getElementById('alert-message-box');
      const submitBtn = document.getElementById('btn-submit-login');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        alertBox.className = 'd-none alert mb-3';

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        if (!email || !password) {
          showAlert('Please provide both email and password.', 'danger');
          return;
        }

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Logging in...';

        try {
          const loginUrl = (typeof Auth !== 'undefined' && Auth.apiUrl) ? Auth.apiUrl('/api/auth/login') : '/api/auth/login';
          const res = await fetch(loginUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
          });

          const data = await res.json();

          if (data.success) {
            showAlert('Login successful! Redirecting to dashboard...', 'success');
            Auth.setSession(data.token, data.user);
            Auth.showToast(`Welcome back, ${data.user.name}!`, 'success');
            setTimeout(() => {
              window.location.href = 'dashboard.html';
            }, 800);
          } else {
            showAlert(data.message || 'Authentication failed. Please verify credentials.', 'danger');
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="bi bi-box-arrow-in-right me-2"></i> Login to Platform';
          }
        } catch (err) {
          showAlert('Network error: Cannot reach the backend server. Please verify the Node.js server is running on http://localhost:3000.', 'danger');
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<i class="bi bi-box-arrow-in-right me-2"></i> Login to Platform';
        }
      });

      function showAlert(msg, type) {
        alertBox.className = `alert alert-${type} mb-3`;
        alertBox.textContent = msg;
        alertBox.classList.remove('d-none');
      }
    });
  </script>
</body>
</html>
